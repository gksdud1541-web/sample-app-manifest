apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-deployment
  namespace: default
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: sample-app
        image: gksdud3107/sample-app:13
        imagePullPolicy: Always
        ports:
        - containerPort: 80
